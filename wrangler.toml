#:schema node_modules/wrangler/config-schema.json
name = "tengoping-com"
compatibility_date = "2026-03-01"

# Los headers (seguridad + Cache-Control) viven en public/_headers,
# que scripts/postbuild.mjs regenera en dist/_headers en cada build.
# Cloudflare (Pages y Workers static assets) lee ese archivo; las reglas
# [[assets.headers.rules]] de este fichero NO se aplican en Pages.

[assets]
directory = "./dist"
not_found_handling = "404-page"
